<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Gangi Reddy Suuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #F9FAFB;
    color: #111827;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .top-bar {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #E5E7EB;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 10;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .title-group a {
    text-decoration: none;
    color: #4B5563;
    font-size: 13.5px;
    font-weight: 500;
  }
  .title-group a:hover { color: #111827; }
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #111827;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .btn-download:hover { background: #374151; }
  .canvas-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 24px;
  }
  canvas {
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    max-width: 100%;
    height: auto !important;
  }
  .loading-msg {
    font-size: 14px;
    color: #6B7280;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="top-bar">
  <div class="title-group">
    <a href="Profile.dc.html">← Back to Profile</a>
    <span style="color:#D1D5DB;">/</span>
    <span style="font-size:14px; font-weight:600; color:#111827;">Gangi Reddy Suuda — Resume</span>
  </div>
  <a href="uploads/Gangi_Reddy_Suuda_2026.pdf" download class="btn-download">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 11v3a1 1 0 001 1h10a1 1 0 001-1v-3M8 2v9M4 7l4 4 4-4"/>
    </svg>
    <span>Download PDF</span>
  </a>
</div>

<div class="canvas-wrapper" id="container">
  <div id="loading" class="loading-msg">Loading resume...</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function load() {
  const container = document.getElementById('container');
  const loading = document.getElementById('loading');
  try {
    const pdf = await pdfjsLib.getDocument('uploads/Gangi_Reddy_Suuda_2026.pdf').promise;
    loading.remove();
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const canvas = document.createElement('canvas');
      container.appendChild(canvas);
      const viewport = page.getViewport({ scale: 1.8 });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    }
  } catch (err) {
    loading.textContent = 'Could not load PDF directly. Please use the download button above.';
  }
}
load();
</script>
</body>
</html>
